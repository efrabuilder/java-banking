<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EfraBank — Sistema bancario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0F1720;
    --panel: #172230;
    --panel2: #1D2A3A;
    --border: #2A3B4D;
    --border-soft: #22303F;
    --text: #EDE7DA;
    --text-muted: #8593A3;
    --gold: #D4A34A;
    --rose: #E0674F;
    --teal: #4FA490;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 2rem 1rem;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .brand-icon {
    width: 40px; height: 40px; border-radius: 6px; background: var(--gold);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-name {
    font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
  }
  .brand-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 0.05em; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .repo-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text-muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 12px;
  }
  .repo-link:hover { color: var(--gold); border-color: var(--gold); }

  .msg {
    margin: 20px 0;
    padding: 10px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--panel);
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .msg.ok { border-color: var(--gold); color: var(--gold); }
  .msg.err { border-color: var(--rose); color: var(--rose); }
  .msg.info { color: var(--text-muted); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 22px;
  }

  .label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }

  .row { display: flex; gap: 8px; }
  .col { display: flex; flex-direction: column; gap: 10px; }

  input.efb {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 14px;
    width: 100%;
    outline: none;
  }
  input.efb:focus { border-color: var(--gold); }
  input.efb::placeholder { color: var(--text-muted); }

  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase;
    border-radius: 4px; padding: 10px 16px; cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--text);
  }
  .btn:active { transform: scale(0.97); }
  .btn-gold { background: var(--gold); color: #201502; }
  .btn-gold:hover { opacity: 0.9; }
  .btn-outline { border-color: var(--border); }
  .btn-outline:hover { border-color: var(--gold); }
  .btn-outline.wide { justify-content: space-between; width: 100%; font-family: 'IBM Plex Mono', monospace; text-transform: none; }

  .account-list { display: flex; flex-direction: column; gap: 6px; }

  .balance { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600; color: var(--gold); margin-top: 18px; }

  .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .form-inline {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }

  .receipt {
    background: repeating-linear-gradient(-45deg, var(--panel) 0px, var(--panel) 6px, var(--panel2) 6px, var(--panel2) 7px);
    border: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    padding: 16px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .receipt-row {
    display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px dashed var(--border-soft);
  }
  .receipt-row:last-child { border-bottom: none; }
  .torn {
    height: 14px;
    background:
      linear-gradient(-45deg, transparent 8px, var(--bg) 8px) 0 4px,
      linear-gradient(45deg, transparent 8px, var(--bg) 8px) 0 4px;
    background-repeat: repeat-x;
    background-size: 16px 20px;
    background-color: var(--panel);
  }

  .footer {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-soft);
    text-align: center; font-size: 11px; color: var(--text-muted); letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#201502" stroke-width="2">
          <line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/>
          <line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/>
          <line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 21 7 3 7"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">EFRABANK</div>
        <div class="brand-sub">TERMINAL DE CUENTAS — v1.0</div>
      </div>
    </div>
    <a class="repo-link" href="https://github.com/efrabuilder/java-banking" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.3-3.2-.1-.3-.6-1.6.1-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6.2 0c2.3-1.6 3.4-1.2 3.4-1.2.6 1.6.2 2.9.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.7 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
      Ver repositorio
    </a>
  </div>

  <div id="msg" class="msg info">Bienvenido. Inicie sesion o cree una cuenta.</div>

  <div id="app"></div>

  <div class="footer">© 2026 All rights reserved · Designed &amp; built by Efraín Sebastián Rojas Artavia</div>
</div>

<script>
  const money = n => `$${n.toFixed(2)}`;
  function nowStamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  const TYPE_META = {
    DEPOSIT:      { sign: "+", color: "var(--gold)" },
    WITHDRAWAL:   { sign: "-", color: "var(--rose)" },
    TRANSFER_IN:  { sign: "+", color: "var(--teal)" },
    TRANSFER_OUT: { sign: "-", color: "var(--rose)" },
  };

  let state = {
    accounts: [
      ["Efraín Rojas", 1500],
      ["Maria García", 3200],
      ["Carlos López", 800],
    ].map(([owner, initial], i) => ({
      id: `ACC-${1001+i}`, owner, balance: initial,
      history: [{ type: "DEPOSIT", amount: initial, description: "Initial deposit", timestamp: nowStamp() }],
    })),
    nextId: 1004,
    sessionId: null,
    activeForm: null,
    loginInput: "",
  };

  function say(type, text) {
    const el = document.getElementById("msg");
    el.className = "msg " + type;
    el.textContent = text;
  }

  function findAccount(id) {
    return state.accounts.find(a => a.id === (id || "").trim().toUpperCase());
  }

  function login(id) {
    const acc = findAccount(id);
    if (!acc) { say("err", "Cuenta no encontrada."); return; }
    state.sessionId = acc.id;
    state.activeForm = null;
    say("ok", `Bienvenido de nuevo, ${acc.owner}.`);
    render();
  }

  function logout() {
    state.sessionId = null;
    state.activeForm = null;
    say("info", "Sesion cerrada.");
    render();
  }

  function createAccount(name, initial) {
    if (!name || !name.trim()) { say("err", "Ingrese un nombre valido."); return; }
    if (isNaN(initial) || initial < 0) { say("err", "Monto inicial invalido."); return; }
    const id = `ACC-${state.nextId++}`;
    const history = initial > 0 ? [{ type: "DEPOSIT", amount: initial, description: "Initial deposit", timestamp: nowStamp() }] : [];
    state.accounts.push({ id, owner: name.trim(), balance: initial || 0, history });
    state.activeForm = null;
    say("ok", `Cuenta creada: ${id}`);
    render();
  }

  function session() { return findAccount(state.sessionId); }

  function deposit(amount, reason) {
    const acc = session();
    if (isNaN(amount) || amount <= 0) { say("err", "Monto invalido."); return; }
    acc.balance += amount;
    acc.history.push({ type: "DEPOSIT", amount, description: reason || "Deposito", timestamp: nowStamp() });
    state.activeForm = null;
    say("ok", `Deposito de ${money(amount)} realizado.`);
    render();
  }

  function withdraw(amount, reason) {
    const acc = session();
    if (isNaN(amount) || amount <= 0 || amount > acc.balance) { say("err", "Fondos insuficientes o monto invalido."); return; }
    acc.balance -= amount;
    acc.history.push({ type: "WITHDRAWAL", amount, description: reason || "Retiro", timestamp: nowStamp() });
    state.activeForm = null;
    say("ok", `Retiro de ${money(amount)} realizado.`);
    render();
  }

  function transfer(targetId, amount) {
    const acc = session();
    const target = findAccount(targetId);
    if (!target) { say("err", "Cuenta destino no encontrada."); return; }
    if (target.id === acc.id) { say("err", "No puede transferirse a si mismo."); return; }
    if (isNaN(amount) || amount <= 0 || amount > acc.balance) { say("err", "Fondos insuficientes o monto invalido."); return; }
    acc.balance -= amount;
    acc.history.push({ type: "TRANSFER_OUT", amount, description: `Transfer to ${target.id}`, timestamp: nowStamp() });
    target.balance += amount;
    target.history.push({ type: "TRANSFER_IN", amount, description: `Transfer from ${acc.id}`, timestamp: nowStamp() });
    state.activeForm = null;
    say("ok", `Transferencia de ${money(amount)} a ${target.owner} realizada.`);
    render();
  }

  function setForm(name) {
    state.activeForm = state.activeForm === name ? null : name;
    render();
  }

  function renderNoSession() {
    const accountRows = state.accounts.map(a => `
      <button class="btn btn-outline wide" onclick="document.getElementById('loginInput').value='${a.id}'">
        <span>${a.id} — ${a.owner}</span>
        <span style="color:var(--gold)">${money(a.balance)}</span>
      </button>
    `).join("");

    const createFormHtml = state.activeForm === "create" ? `
      <div class="col">
        <input class="efb" id="newName" placeholder="Nombre completo" />
        <input class="efb" id="newInitial" placeholder="Deposito inicial ($)" />
        <div class="row">
          <button class="btn btn-gold" onclick="createAccount(document.getElementById('newName').value, parseFloat(document.getElementById('newInitial').value))">Crear</button>
          <button class="btn btn-outline" onclick="setForm('create')">Cancelar</button>
        </div>
      </div>
    ` : `<button class="btn btn-outline" onclick="setForm('create')">+ Nueva cuenta</button>`;

    document.getElementById("app").innerHTML = `
      <div class="grid2">
        <div class="panel">
          <div class="label">Iniciar sesion</div>
          <div class="row" style="margin-bottom:16px;">
            <input class="efb" id="loginInput" placeholder="ID de cuenta (ej. ACC-1001)" value="${state.loginInput}"
              onkeydown="if(event.key==='Enter'){login(this.value)}" />
            <button class="btn btn-gold" onclick="login(document.getElementById('loginInput').value)">Entrar</button>
          </div>
          <div class="label">Cuentas registradas</div>
          <div class="account-list">${accountRows}</div>
        </div>
        <div class="panel">
          <div class="label">Crear cuenta nueva</div>
          ${createFormHtml}
          <div style="margin-top:20px;font-size:12px;color:var(--text-muted);line-height:1.6;">
            Reimplementacion web de <span style="color:var(--gold)">BankingSystem.java</span>.
            La logica de cuentas, depositos, retiros y transferencias corre en el navegador.
          </div>
        </div>
      </div>
    `;
  }

  function renderDashboard() {
    const acc = session();
    const formsHtml = {
      deposit: `<div class="form-inline">
          <input class="efb" id="f0" placeholder="Monto ($)" />
          <input class="efb" id="f1" placeholder="Motivo (opcional)" />
          <div class="row">
            <button class="btn btn-gold" onclick="deposit(parseFloat(document.getElementById('f0').value), document.getElementById('f1').value)">Confirmar deposito</button>
            <button class="btn btn-outline" onclick="setForm('deposit')">Cancelar</button>
          </div>
        </div>`,
      withdraw: `<div class="form-inline">
          <input class="efb" id="f0" placeholder="Monto ($)" />
          <input class="efb" id="f1" placeholder="Motivo (opcional)" />
          <div class="row">
            <button class="btn btn-gold" onclick="withdraw(parseFloat(document.getElementById('f0').value), document.getElementById('f1').value)">Confirmar retiro</button>
            <button class="btn btn-outline" onclick="setForm('withdraw')">Cancelar</button>
          </div>
        </div>`,
      transfer: `<div class="form-inline">
          <input class="efb" id="f0" placeholder="ID cuenta destino" />
          <input class="efb" id="f1" placeholder="Monto ($)" />
          <div class="row">
            <button class="btn btn-gold" onclick="transfer(document.getElementById('f0').value, parseFloat(document.getElementById('f1').value))">Confirmar transferencia</button>
            <button class="btn btn-outline" onclick="setForm('transfer')">Cancelar</button>
          </div>
        </div>`,
    };

    const historyRows = [...acc.history].reverse().map(t => {
      const meta = TYPE_META[t.type];
      return `<div class="receipt-row">
        <span style="color:var(--text-muted)">[${t.timestamp}] ${t.description}</span>
        <span style="color:${meta.color};font-weight:600">${meta.sign}${money(t.amount)}</span>
      </div>`;
    }).join("") || `<div style="color:var(--text-muted)">Sin movimientos todavia.</div>`;

    document.getElementById("app").innerHTML = `
      <div class="panel" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="label">${acc.id}</div>
            <div style="font-size:18px;font-weight:500;">${acc.owner}</div>
          </div>
          <button class="btn btn-outline" onclick="logout()">Salir</button>
        </div>
        <div class="balance">${money(acc.balance)}</div>
        <div class="actions">
          <button class="btn btn-outline" onclick="setForm('deposit')">Depositar</button>
          <button class="btn btn-outline" onclick="setForm('withdraw')">Retirar</button>
          <button class="btn btn-outline" onclick="setForm('transfer')">Transferir</button>
        </div>
        ${state.activeForm ? formsHtml[state.activeForm] : ""}
      </div>
      <div class="label">Historial de transacciones</div>
      <div class="receipt">${historyRows}</div>
      <div class="torn"></div>
    `;
  }

  function render() {
    if (session()) renderDashboard(); else renderNoSession();
  }

  render();
</script>
</body>
</html>
